<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://oxewhsqmdkiasckvnyua.supabase.co https://images.pexels.com; connect-src 'self' https://oxewhsqmdkiasckvnyua.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>글공장</title>
<meta name="description" content="블로그 원고 관리 — 주제 고르기, 원고 검수, 발행 기록, 실적·수익 정리">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글공장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css?v=1.5.0">
</head>
<body>

<!-- 로그인 -->
<section class="gate" id="gate" hidden>
  <div class="top"><h1><span class="hl">글공장</span></h1></div>
  <p class="hint" id="gateMsg">이 앱은 접속 코드가 있어야 열려. 받은 코드를 넣어줘.</p>
  <label class="f">접속 코드
    <input type="password" id="gateInput" autocomplete="current-password" autocapitalize="off" spellcheck="false">
  </label>
  <label class="chk"><input type="checkbox" id="gateShow"> 코드 보이기</label>
  <div class="go"><button class="btn" id="gateBtn" type="button">열기</button></div>
  <p class="hint">한 번 열면 이 기기만 로그인 상태로 남아. 접속 코드는 기기에 저장하지 않아.</p>
</section>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1><span class="hl">글공장</span></h1>
      <p class="sub" id="subline"></p>
    </div>
    <button class="iconbtn" id="refreshBtn" type="button">새로고침</button>
  </header>
  <div class="banner" id="upd" role="status" hidden><p id="updText"></p><button class="btn sm ghost" id="updOk" type="button">확인</button></div>
  <p class="err" id="errLine" role="alert" hidden></p>
  <div class="banner" id="newData" hidden><p>새 내용이 있어.</p><button class="btn sm ghost" id="newDataBtn" type="button">보기</button></div>
  <main class="view" id="view"></main>
</div>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="메뉴" hidden>
  <button type="button" role="tab" data-tab="home" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>홈
    <span class="dot" id="homeDot" hidden></span>
  </button>
  <button type="button" role="tab" data-tab="content" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h9.5L19 9v10.5H5z"/><path d="M14.5 4.5V9H19M8.5 13h7M8.5 16.5h5"/></svg>콘텐츠
  </button>
  <button type="button" role="tab" data-tab="topics" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>주제
  </button>
  <button type="button" role="tab" data-tab="money" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 20V11M10 20V5M15.5 20v-6.5M21 20H3"/></svg>수익
  </button>
  <button type="button" role="tab" data-tab="settings" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>설정
  </button>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
<div class="dim" id="dim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="sheet-in" id="sheetIn"></div></div>
<noscript><p class="err">이 앱은 자바스크립트가 켜져 있어야 동작해.</p></noscript>
<script type="module" src="app.js?v=1.5.0"></script>
</body>
</html>
